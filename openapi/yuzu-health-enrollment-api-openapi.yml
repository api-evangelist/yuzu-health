              - type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              - type: 'null'
            phoneNumber:
              anyOf:
              - type: string
                example: '+12125551234'
              - type: 'null'
            birthday:
              type: string
              example: '2025-01-01'
            planFeeIds:
              default: []
              type: array
              items:
                type: string
            __id:
              type: string
          required:
          - line1
          - city
          - zip
          - firstName
          - lastName
          - birthday
        relationship:
          type: string
          enum:
          - spouse
          - child
        effectiveDate:
          type: string
          example: '2025-01-01'
        reason:
          type: string
          enum:
          - birth
          - adoption
          - marriage
          - qualifiedMedicalChildSupportOrder
          - lossOfCoverage
          - subscriberOpenEnrollment
          - subscriberNewHire
          - other
      required:
      - dependent
      - relationship
      - effectiveDate
      - reason
