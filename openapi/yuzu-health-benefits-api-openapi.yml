components:
  schemas:
    BenefitLookupCodeResultDto:
      type: object
      properties:
        codeSet:
          anyOf:
          - type: string
            enum:
            - Procedure
            - Revenue
          - type: 'null'
          x-nestjs_zod-empty-type: true
        label:
          type: string
        matchedBenefits:
          type: array
          items:
            type: object
            properties:
              benefitCategory:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    anyOf:
                    - type: string
                    - type: 'null'
                  legalDescription:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - id
                - name
                - description
                - legalDescription
              costSharing:
                type: array
                items:
                  type: object
                  properties:
                    tierId:
                      type: string
                    covered:
                      type: boolean
                    copayCents:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    ifApplicable:
                      default: false
                      type: boolean
                    coinsurancePct:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    requiresDeductibleMet:
                      default: false
                      type: boolean
                    waiveCopayAfterDays:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    waiveCostSharingForVisits:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    notes:
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - tierId
                  - covered
                  - copayCents
                  - coinsurancePct
                  - waiveCopayAfterDays
                  - waiveCostSharingForVisits
                  - notes
              limitations:
                type: object
                properties:
                  maxVisitsPerYear:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  maxDaysPerYear:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  moneyPerLifetimeCents:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  maxDaysPerLifetime:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  moneyPerFillCents:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  maxHoursPerVisit:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  excludeChildDependents:
                    anyOf:
                    - type: boolean
                    - type: 'null'
                  limitationNotes:
                    anyOf:
                    - type: string
                    - type: 'null'
                  precertMayBeRequired:
                    default: false
                    type: boolean
                required:
                - maxVisitsPerYear
                - maxDaysPerYear
                - moneyPerLifetimeCents
                - maxDaysPerLifetime
                - moneyPerFillCents
                - maxHoursPerVisit
                - excludeChildDependents
                - limitationNotes
              benefitNotes:
                anyOf:
                - type: string
                - type: 'null'
              precertRequirements:
                type: array
                items:
                  type: object
                  properties:
                    benefitCategoryId:
                      type: string
                    rule:
                      type: object
                      properties:
                        minHoursPerAdmission:
                          anyOf:
                          - type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          - type: 'null'
                        minAge:
                          anyOf:
                          - type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          - type: 'null'
                        minMoneyPerServiceLineCents:
                          anyOf:
                          - type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          - type: 'null'
                        minDaysPerClaim:
                          anyOf:
                          - type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          - type: 'null'
                        excludePosCode:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - minHoursPerAdmission
                      - minAge
                      - minMoneyPerServiceLineCents
                      - minDaysPerClaim
                      - excludePosCode
                  required:
                  - benefitCategoryId
              procedureCodeRanges:
                type: array
                items:
                  type: string
              revenueCodeRanges:
                type: array
                items:
                  type: string
              humanReadable:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        tierId:
                          type: string
                        tierName:
                          type: string
                        payment:
                          type: string
                      required:
                      - tierId
