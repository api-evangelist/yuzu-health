                      - tierId: tier-in-network
                        covered: true
                        copayCents: 2500
                        coinsurancePct: null
                        ifApplicable: false
                        requiresDeductibleMet: false
                        waiveCopayAfterDays: null
                        waiveCostSharingForVisits: null
                        notes: null
