openapi: 3.0.0
info:
  title: Yuzu Accumulator (Experimental) Accumulator (Experimental) EOB (Experimental) API
  description: Yuzu's Public API
  version: '0.5'
  contact: {}
servers: []
tags:
- name: EOB (Experimental)
paths:
  /v2/eob/download/{claimId}:
    get:
      operationId: PublicEobController_downloadEob
      parameters:
      - name: claimId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: EOB PDF downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uint8Array'
      security:
      - public-api-auth: []
      summary: Download EOB PDF by claim ID
      tags:
      - EOB (Experimental)
components:
  schemas:
    Uint8Array:
      type: object
      properties: {}
  securitySchemes:
    public-api-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
