          - DC
          - AS
          - GU
          - MP
          - PR
          - VI
        zip:
          type: string
          pattern: ^\d{5}(?:[ -]?\d{4})?$
  securitySchemes:
    public-api-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
