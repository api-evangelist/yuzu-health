                          - tertiary
                          - four
                          - five
                          - six
                          - seven
                          - eight
                          - nine
                          - ten
                          - eleven
                          - unknown
                        organizationName:
                          type: string
                        subscriberFirstName:
                          type: string
                        subscriberLastName:
                          type: string
                      required:
                      - id
                required:
                - coverages
              currentAddresses:
                type: array
                items:
                  type: object
                  properties:
                    address1:
                      type: string
                    address2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                      enum:
                      - AL
                      - AK
                      - AZ
                      - AR
                      - CA
                      - CO
                      - CT
                      - DE
                      - FL
                      - GA
                      - HI
                      - ID
                      - IL
                      - IN
                      - IA
                      - KS
                      - KY
                      - LA
                      - ME
                      - MD
                      - MA
                      - MI
                      - MN
                      - MS
                      - MO
                      - MT
                      - NE
                      - NV
                      - NH
                      - NJ
                      - NM
                      - NY
                      - NC
                      - ND
                      - OH
                      - OK
                      - OR
                      - PA
                      - RI
                      - SC
                      - SD
                      - TN
                      - TX
                      - UT
                      - VT
                      - VA
                      - WA
                      - WV
                      - WI
                      - WY
                      - DC
                      - AS
                      - GU
                      - MP
                      - PR
                      - VI
                    postalCode:
                      type: string
                      pattern: ^\d{5}(?:[ -]?\d{4})?$
                  required:
                  - address1
                  - city
                  - state
                  - postalCode
              coverages:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    coverageStatus:
                      type: string
                      enum:
                      - active
                      - inactive
                      - pending
                      - cobra
                      - annulled
                    eligibilitySince:
                      type: string
                      example: '2025-01-01'
                    eligibilityUntil:
                      type: string
                      example: '2025-01-01'
                    groupId:
                      type: string
                    planId:
                      type: string
                    subscriberId:
                      anyOf:
                      - type: string
                      - type: 'null'
                    memberNumber:
                      type: string
                    relationship:
                      type: string
                      enum:
                      - subscriber
                      - spouse
                      - child
                    alternateID:
                      type: string
                    fees:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          startDate:
                            type: string
                            example: '2025-01-01'
                          endDate:
                            type: string
                            example: '2025-01-01'
                          planFeeId:
                            type: string
                          vendorId:
                            type: string
                        required:
