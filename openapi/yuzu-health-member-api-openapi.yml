                        - name
                        - startDate
                        - endDate
                        - planFeeId
                        - vendorId
                    pcpPreferences:
                      type: object
                      properties:
                        optOut:
                          type: boolean
                      required:
                      - optOut
                    locations:
                      type: array
                      items:
                        type: string
                    departments:
                      type: array
                      items:
                        type: string
