      operationId: PublicApiV1Controller_listAllMedicalClaims
      parameters:
      - name: serviceStartDate
        required: false
        in: query
        description: Filter by service start date
        schema:
          type: string
      - name: serviceEndDate
        required: false
        in: query
        description: Filter by service end date
        schema:
          type: string
      - name: groupPolicyId
        required: false
        in: query
        description: Filter by group policy ID
        schema:
          type: string
      - name: coverageId
        required: false
        in: query
        description: Filter by coverage ID
        schema:
          type: string
      - name: startAfter
        required: false
        in: query
        description: Pagination cursor
        schema:
          type: string
      responses:
