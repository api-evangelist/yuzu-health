      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDto'
      security:
      - public-api-auth: []
      summary: Create a coverage fee
      tags:
      - PublicApiV1
  /v1/coverages/{coverageId}/fees/{coverageFeeId}:
    patch:
      description: Update an existing fee for a specific coverage.
      operationId: PublicApiV1Controller_updateCoverageFee
      parameters:
      - name: coverageId
        required: true
        in: path
        schema:
          type: string
      - name: coverageFeeId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        description: Coverage Fee Update Data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageFeeUpdateDto'
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDto'
      security:
      - public-api-auth: []
      summary: Update a coverage fee
      tags:
      - PublicApiV1
    delete:
      description: Remove an existing fee for a specific coverage.
      operationId: PublicApiV1Controller_deleteCoverageFee
      parameters:
      - name: coverageId
        required: true
        in: path
        schema:
          type: string
      - name: coverageFeeId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Coverage
          content:
            application/json:
