aid: yuzu-health
name: Yuzu Health
description: >-
  Yuzu Health is a technology platform for building and operating custom, self-funded health plans
  end to end - plan design, member enrollment and eligibility, in-house medical and pharmacy claims
  adjudication, benefit accumulators, EOBs, ID cards, and payments - without legacy TPA systems. Its
  public REST API (bearer-JWT API keys, URL-prefix versioning v1/v2/v3, cursor pagination) exposes 76
  operations across members, sponsors, groups/policies, coverages, claims, enrollment, benefits, care
  events, and accumulators, plus a white-label portal. Yuzu is backed by General Catalyst and Menlo
  Ventures.
